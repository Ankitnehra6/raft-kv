syntax = "proto3";

package raftkv;

option java_package = "io.github.ankitnehra6.raftkv.grpc";
option java_multiple_files = true;

// The client-facing API.
service KeyValue {
  rpc Put(PutRequest) returns (WriteReply);
  rpc Get(GetRequest) returns (GetReply);
  rpc Delete(DeleteRequest) returns (WriteReply);
  rpc Status(StatusRequest) returns (StatusReply);
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message GetRequest {
  string key = 1;
}

message DeleteRequest {
  string key = 1;
}

message WriteReply {
  bool ok = 1;
  // Set when this node is not the leader, so a client can retry against the right one.
  string leader_hint = 2;
  uint64 index = 3;
}

message GetReply {
  bool ok = 1;
  string leader_hint = 2;
  bool found = 3;
  string value = 4;
}

message StatusRequest {}

message StatusReply {
  string node_id = 1;
  string role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  string leader_id = 5;
  repeated string members = 6;
}
